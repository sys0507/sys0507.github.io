  summary: >-
    A review of how induced pluripotent stem cells can be gene engineered and differentiated into T, NK, iNKT, γδ T
    cells and macrophages to make universal, off-the-shelf cancer immunotherapies.

- key: jpcb-2022
  title: "Spatial organization of Dectin-1 and TLR2 during synergistic crosstalk revealed by super-resolution imaging"
  authors: "M. Li, C. Vultorius, M. Bethi, Y. Yu"
  venue: "The Journal of Physical Chemistry B"
  year: 2022
  citation: "126(31):5781–5792"
  doi: "10.1021/acs.jpcb.2c03557"
  role: first
  kind: article
  topics: [imaging]
  image: /assets/img/pubs/jpcb-2022.png
  image_width: 1536
  image_height: 1024
  image_alt: "Computational spatial analysis of two-color dSTORM reveals partially overlapping Dectin-1 and TLR2 nanoclusters with stronger signaling."
  graphic_caption: >-
    Computational spatial analysis turns two-color dSTORM localizations into a quantitative map of innate immune receptor crosstalk. After localization correction and filtering, ToMATo identifies Dectin-1 and TLR2 nanoclusters; nearest-neighbor analysis and simulation-validated coordinate-based colocalization (CBC) quantify their spatial relationship. In RAW264.7 macrophages co-stimulated with Pam3 and curdlan for 10 min, the receptor populations remain organized in distinct, partially overlapping nanoclusters. Approximately 35% of clustered localizations meet the colocalization criterion (DoC ≥ 0.4). Separate measurements of TLR2–MyD88 and Dectin-1–pSyk colocalization indicate increased receptor activation, accompanied by stronger phosphotyrosine signaling.
    Localization maps are conceptual illustrations, not experimental data. The results support a model of crosstalk at nanocluster interfaces; direct molecular interactions within those interfaces remain to be established. The study used RAW264.7 cells stably expressing GFP-Dectin-1.
  summary: >-
    Two-color single-molecule super-resolution imaging showed that Dectin-1 and TLR2 form separate nanoclusters that
    partially overlap during synergistic signaling, rather than mixing into one complex.

- key: bpj-2022
  title: "Immobile ligands enhance FcγR-TLR2/1 crosstalk by promoting interface overlap of receptor clusters"
  authors: "M. Li, S. Lee, M. Zahedian, C. Ding, J. Yan, Y. Yu"
  venue: "Biophysical Journal"
  year: 2022
  doi: "10.1016/j.bpj.2022.02.010"
  role: first
  kind: article
  topics: [imaging]
  image: /assets/img/pubs/bpj-2022.png
  image_width: 1536
  image_height: 1024
  image_alt: "TIRF-STORM, ToMATo clustering and CBC reveal greater overlap between MyD88 and pSyk nanoclusters and stronger macrophage signaling with lower ligand mobility."
  graphic_caption: >-
    Computational analysis of super-resolution images reveals how ligand mobility regulates FcγR–TLR2/1 crosstalk. IgG and Pam3 are presented on supported lipid bilayers at matched ligand densities but different lateral mobilities. Two-color TIRF-STORM maps MyD88 and pSyk, used as activation readouts for TLR2/1 and FcγR, respectively. ToMATo identifies nanoclusters, and coordinate-based colocalization (CBC) quantifies overlap between their localized signals. With lower ligand mobility, distinct nanoclusters develop more overlap at their interfaces. Complementary TIRF kernel-density and nearest-neighbor statistics support their organization into signalosomes. Greater interface overlap accompanies stronger phosphotyrosine signaling and inflammatory cytokine secretion.
    Imaging and phosphotyrosine measurements were performed in RAW264.7 macrophages after 30 min of stimulation. Separate 6 h ELISAs measured TNF in RAW264.7 cells and TNF plus IL-12 in primary murine bone marrow-derived macrophages. Cluster maps are conceptual; spatial overlap supports cluster-scale crosstalk without establishing direct molecular binding. Low mobility denotes reduced, not abolished, ligand diffusion.
  summary: >-
    When ligands on a model pathogen membrane move less, FcγR and TLR2/1 nanoclusters overlap more at their
    interface, and macrophages mount a stronger inflammatory response — a physical way to tune immunity.

- key: jcs-2021
  title: "Innate immune receptor clustering and its role in immune regulation"
  authors: "M. Li, Y. Yu"
  venue: "Journal of Cell Science"
  year: 2021
  citation: "134(4)"
  doi: "10.1242/jcs.249318"
  role: first
  kind: review
  topics: [imaging]
  image: /assets/img/pubs/jcs-2021.png
  image_width: 1536
  image_height: 1024
  image_alt: "Review synthesis linking super-resolution imaging, quantitative analysis of receptor cluster size, spacing and segregation, and patterned-ligand experiments to innate immune signaling."
  graphic_caption: >-
    This review connects the quantitative interpretation of super-resolution images with the spatial regulation of innate immunity. Imaging studies, including STORM, reveal receptor nanoclusters and their organization. Computational interpretation of these images makes cluster size, spacing and segregation accessible to measurement. The schematic analysis panel summarizes these spatial questions rather than a specific algorithm introduced by the review.
    Two examples illustrate the biological significance: nearby, distinct Dectin-1 and TLR2 nanoclusters support signaling crosstalk, whereas exclusion of the inhibitory phosphatase CD45 from activated FcγR signaling regions helps sustain signaling. Complementary experiments using patterned ligands on planar substrates or engineered particles manipulate receptor arrangements and test functional consequences. Mixed and spatially segregated ligand patterns on particles probe Dectin-1–TLR2 cooperation through macrophage response measurements. Together, quantitative imaging and spatial perturbation help connect receptor organization to immune function. This is a conceptual synthesis of published studies discussed in the review; all localization maps and experimental icons are schematic.
  summary: >-
    A review of how innate immune receptors assemble into nano- and micro-scale clusters, and how that spatial
    organization shapes pathogen detection and downstream signaling.

