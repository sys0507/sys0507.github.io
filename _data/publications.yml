  image_width: 1536
  image_height: 1024
  image_alt: "A renewable engineered iPSC bank supplies iPSC-derived CAR-T and CAR-NK cells, with other immune lineages under study."
  graphic_caption: >-
    Reprogramming donor somatic cells creates a renewable iPSC source that can be genetically engineered, clonally selected and banked. Directed differentiation generates distinct immune-cell products, including CAR-T and CAR-NK cells, supporting the development of scalable, off-the-shelf cancer immunotherapy. Additional iPSC-derived lineages under study include iNKT, gamma-delta T, MAIT cells and macrophages.
