  image_alt: "Nanoarrays with ligand clusters at three spacings, and a response curve that rises as spacing shrinks until it plateaus."
  summary: >-
    We built nanoarrays that mimic the contact zone between a macrophage and a microbe. Moving ligand clusters closer
