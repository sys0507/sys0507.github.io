- key: acsnano-2019
  title: "Tracking single molecules in biomembranes: Is seeing always believing?"
  authors: "Y. Yu, M. Li, Y. Yu"
  venue: "ACS Nano"
  year: 2019
  citation: "13:10860–10868"
  doi: "10.1021/acsnano.9b07445"
  role: contributing
  kind: perspective
  topics: [imaging]
  image: /assets/img/pubs/acsnano-2019.png
  image_width: 1536
  image_height: 1024
  image_alt: "Perspective on single-particle tracking: multivalent gold probes cross-link membrane lipids, while monovalent oriented labeling reduces perturbation; computational localization, linking and mean-square displacement analysis quantify motion."
  graphic_caption: >-
    Single-particle tracking reveals membrane dynamics, but probe attachment can alter the motion being measured. This Perspective explains how centroid localization, frame-to-frame linking and mean-square displacement analysis reconstruct trajectories and distinguish diffusion behaviors. Its central caution is illustrated by a model-membrane study by Liao et al. discussed in the article: multivalent gold-nanoparticle attachments can cross-link lipids and slow diffusion, whereas monovalent, oriented labeling can reduce perturbation. Probe size, linker design and membrane geometry also matter. The figure synthesizes reviewed evidence; the diffusion curves are conceptual, and reduced labeling artifacts in model membranes do not establish artifact-free tracking in cells.
  summary: >-
    A perspective on single-particle tracking in cell membranes: what nanoparticle probes have revealed, and how
    probe size, labeling, and analysis choices can produce misleading trajectories.

- key: nanolett-2015
  title: "Optical injection of gold nanoparticles into living cells"
  authors: "M. Li, T. Lohmüller, J. Feldmann"
  venue: "Nano Letters"
  year: 2015
  citation: "15(1):770–775"
  doi: "10.1021/nl504497m"
  role: first
  kind: article
  topics: [imaging]
  image: /assets/img/pubs/nanolett-2015.png
  image_width: 1536
  image_height: 1024
  video: /assets/videos/publications/nanolett-2015-explainer.mp4
  video_poster: /assets/img/pubs/nanolett-2015-video-poster.png
  video_caption: "59-second English explainer of the original optical injection platform and its 2018 Janus nanopen extension. Conceptual animations."
  image_alt: "The 2015 optical platform positions and injects single gold nanoparticles into living CHO cells, supported by force and heat calculations. The 2018 inset shows a gold-tip, ssDNA-bearing alumina nanopen, followed by 1064 nm near-infrared optical tweezer positioning depicted in red and 532 nm green-light injection."
  graphic_caption: >-
    Optical printing followed by optical injection enables controlled delivery of individual gold nanoparticles into living CHO cells. In the 2015 study, a 532 nm continuous-wave laser first positions 80 nm gold particles on the cell membrane with its focus below the cell. After excess particles are rinsed away, the beam is refocused onto a selected particle. Force and heat calculations, together with observed nanobubble formation, support a mechanism in which localized membrane disruption and optical scattering force enable particle entry. Selective etching of extracellular gold and a scattering-spectrum red shift support intracellular localization. The reported survival above 70% refers to post-injection cell viability under single-particle conditions, not delivery efficiency or the combined printing-and-injection yield.
    The small 2018 inset shows a later extension by Maier et al.: Janus nanopens combine a gold tip with an alumina shaft carrying fluorescently labeled single-stranded DNA. A 1064 nm near-infrared optical tweezer, depicted in red, positions the nanopen at the cell membrane; a 532 nm green laser then induces gold-tip-first injection. This biomolecule-bearing design and two-wavelength sequence belong to the later study. All illustrations and model-field icons are conceptual and not to scale.
  summary: >-
    A continuous-wave laser first places single gold nanoparticles onto living cells, then injects them through
    plasmonic heating and optical force — with more than 70% post-injection viability under single-particle conditions.
