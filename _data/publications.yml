- key: cell-2025
  title: "Serotonin transporter inhibits antitumor immunity through regulating the intratumoral serotonin axis"
  authors: "B. Li, J. Elsten-Brown, M. Li, E. Zhu, et al."
  venue: "Cell"
  year: 2025
  citation: "188(14):3823–3842"
  doi: "10.1016/j.cell.2025.04.032"
  role: contributing
  kind: article
  topics: [cell-therapy]
  selected: true
  image: /assets/img/pubs/cell-2025.png
  image_width: 1536
  image_height: 1024
  image_alt: "Bioinformatics and functional validation connect SERT blockade to enhanced CD8 T-cell activity: single-cell and human tumor analyses support the serotonin mechanism, while fluoxetine plus anti-PD-1 improves tumor control in mice."
  summary: >-
    Tumor-infiltrating CD8 T cells switch on the serotonin transporter SERT, which acts like an immune checkpoint.
    Widely prescribed antidepressants (SSRIs) that block it boosted anti-tumor T cells and worked together with PD-1
    blockade in mouse models.

