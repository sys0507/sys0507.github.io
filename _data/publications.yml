  graphic_caption: >-
    Stem-cell engineering combines genetic modification and directed differentiation to develop diverse antitumor immune-cell platforms.
    HSCs and PSCs offer alternative starting sources for products such as T cells, NK cells, innate-like T cells and macrophages.
    This review highlights their potential for scalable, off-the-shelf immunotherapy, with platform-specific challenges in safety, immune compatibility and persistence.
    Conceptual synthesis of a review; the depicted cell types represent separate platforms, not a combined product or uniformly clinically validated therapies.
