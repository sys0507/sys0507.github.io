- key: bpj-2022
  title: "Immobile ligands enhance FcγR-TLR2/1 crosstalk by promoting interface overlap of receptor clusters"
  authors: "M. Li, S. Lee, M. Zahedian, C. Ding, J. Yan, Y. Yu"
  venue: "Biophysical Journal"
  year: 2022
  doi: "10.1016/j.bpj.2022.02.010"
  role: first
  kind: article
  topics: [imaging]
  image: /assets/img/pubs/bpj-2022.svg
  image_alt: "Receptor nanoclusters stay apart with mobile ligands and overlap at their interface with immobile ligands, giving a stronger signal."
  summary: >-
    When ligands on a model pathogen membrane can't move, FcγR and TLR2/1 nanoclusters overlap more at their
    interface, and macrophages mount a stronger inflammatory response — a physical way to tune immunity.

