- key: sttt-2026
  title: "Spatiotemporal profiling reveals distinct dynamics and checkpoint regulations of CAR-T and CAR-NKT cells against solid tumors"
  authors: "Y.-R. Li*, M. Li*, Y. Chen, H. Leng, Y. Zhu, … L. Yang"
  venue: "Signal Transduction and Targeted Therapy"
  year: 2026
  doi: "10.1038/s41392-026-02602-x"
  url: "https://www.nature.com/articles/s41392-026-02602-x"
  role: co-first
  kind: article
  topics: [cell-therapy]
  oa: true
  selected: true
  image: /assets/img/pubs/sttt-2026.png
  image_width: 1536
  image_height: 1024
  image_alt: "Conceptual schematic linking spatiotemporal single-cell profiling to matched checkpoint therapies: CAR-T with anti-TIGIT and CAR-NKT with anti-CD96, followed by experimental validation in solid-tumor models."
  summary: >-
    We followed conventional CAR-T cells and stem cell-derived CAR-NKT cells across tissues and time in solid-tumor
    models. CAR-NKT cells homed into tumors better and persisted longer, and the two products responded to different
    checkpoint blockades: TIGIT for CAR-T, CD96 for CAR-NKT.

- key: frontiers-2025
  title: "Differential regulation of Treg stability in human naïve and effector Treg subsets by TGFβ-signaling via ARKADIA-SKI axis"
  authors: "F. Yang, A. Yanes, M. Li, P. Heizer, … Z. Guo"
  venue: "Frontiers in Immunology"
  year: 2025
  citation: "16"
  doi: "10.3389/fimmu.2025.1636434"
  role: contributing
  kind: article
  topics: [cell-therapy]
  oa: true
  image: /assets/img/pubs/frontiers-2025.svg
  image_alt: "TGF-beta signaling stabilizes regulatory T cells; SKI brakes the pathway and ARKADIA degrades SKI."
  summary: >-
    TGFβ signaling keeps human regulatory T cells stable, and naïve and effector subsets depend on it differently.
    Degrading the brake protein SKI with the E3 ligase ARKADIA made Tregs more stable and more suppressive — a lever
    for Treg cell therapy.

- key: med-2025
  title: "Overcoming ovarian cancer resistance and evasion to CAR-T cell therapy by harnessing allogeneic CAR-NKT cells"
  authors: "Y.-R. Li, Z. Li, Y. Zhu, M. Li, Y. Chen, et al."
  venue: "Med"
  year: 2025
  citation: "6(10)"
  doi: "10.1016/j.medj.2025.100804"
  role: contributing
  kind: article
  topics: [cell-therapy]
  image: /assets/img/pubs/med-2025.png
  image_width: 1536
  image_height: 1024
  image_alt: "Conceptual schematic of bioinformatics-guided allogeneic CAR-NKT design for ovarian cancer: CAR, NK receptors, and NKT TCR target tumor cells and the suppressive microenvironment, with cell-state analysis, immunogenicity studies, and preclinical validation."
  summary: >-
    Off-the-shelf CAR-NKT cells attacked ovarian tumors and their suppressive microenvironment through several
