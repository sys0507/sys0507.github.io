  venue: "The Journal of Physical Chemistry B"
  year: 2022
  citation: "126(31):5781–5792"
  doi: "10.1021/acs.jpcb.2c03557"
  role: first
  kind: article
  topics: [imaging]
  image: /assets/img/pubs/jpcb-2022.svg
  image_alt: "Two-color super-resolution image: Dectin-1 and TLR2 nanoclusters partially overlap on a macrophage membrane."
  summary: >-
    Two-color single-molecule super-resolution imaging showed that Dectin-1 and TLR2 form separate nanoclusters that
