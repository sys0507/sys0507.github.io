<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }}, home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="12" cy="16" r="9" class="mk-research"/>
        <circle cx="20" cy="16" r="9" class="mk-code"/>
        <path d="M16 7.94A9 9 0 0 1 16 24.06A9 9 0 0 1 16 7.94Z" class="mk-merge"/>
      </svg>
      <span translate="no">{{ site.author.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {%- assign here = page.url -%}
      <a href="{{ '/projects/' | relative_url }}" {% if here contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/publications/' | relative_url }}" {% if here contains '/publications/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/notebook/' | relative_url }}" {% if here contains '/notebook/' %}aria-current="page"{% endif %}>Notebook</a>
      <a href="{{ '/cv/' | relative_url }}" {% if here contains '/cv/' %}aria-current="page"{% endif %}>CV</a>
    </nav>
  </div>
</header>
