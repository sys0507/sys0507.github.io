<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "honorificSuffix": {{ site.author.honorific | jsonify }},
  "url": {{ site.url | append: site.baseurl | append: '/' | jsonify }},
  "image": {{ site.image | absolute_url | jsonify }},
  "jobTitle": {{ site.author.job_title | jsonify }},
  "worksFor": { "@type": "Organization", "name": {{ site.author.affiliation | jsonify }} },
  "alumniOf": [
    {%- for e in site.data.education %}{ "@type": "CollegeOrUniversity", "name": {{ e.school | jsonify }} }{% unless forloop.last %}, {% endunless %}{% endfor -%}
  ],
  "knowsAbout": ["Computational immunology", "T-cell receptor discovery", "Single-cell RNA sequencing", "Protein language models", "Deep learning", "AI agents", "Bioinformatics pipelines", "CAR-T cell therapy"],
  "sameAs": [{{ site.links.scholar | jsonify }}, {{ site.links.github | jsonify }}, {{ site.links.linkedin | jsonify }}]
}
</script>
