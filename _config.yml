# ---------- SEO (jekyll-seo-tag) ----------
image: /assets/img/og-image.png
twitter:
  card: summary_large_image
social:
  name: "Miao Li"
  links:
    - "https://scholar.google.com/citations?user=JRzxS2wAAAAJ&hl=en"
    - "https://github.com/sys0507"
    - "https://www.linkedin.com/in/miao-li-02886448/"
# google_site_verification: ""   # paste the token from Google Search Console

# ---------- content ----------
collections:
  projects:
    output: true
    permalink: /projects/:name/

permalink: /notebook/:year/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { image: /assets/img/og-image.png }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: mathjax     # $$…$$ is rendered by KaTeX on pages with `math: true`

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
