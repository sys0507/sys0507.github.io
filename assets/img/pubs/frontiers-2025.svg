<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">TGF-beta, SKI and ARKADIA regulate human Treg stability</title><desc id="d">TGF-beta signaling keeps regulatory T cells stable. SKI acts as a brake on the pathway; ARKADIA degrades SKI and restores Treg stability and suppressive function.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><path d="M40,360 C40,140 180,60 330,60 C480,60 600,140 600,360" fill="#D3E9ED" fill-opacity=".45" stroke="#0E6E80" stroke-width="2"/><text x="320.0" y="386.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#6B7A83">human FOXP3+ regulatory T cell</text><polygon points="220.9,40.0 214.0,44.0 207.1,40.0 207.1,32.0 214.0,28.0 220.9,32.0" fill="#FFFFFF" stroke="#1F2D36" stroke-width="1.3"/><polygon points="256.9,40.0 250.0,44.0 243.1,40.0 243.1,32.0 250.0,28.0 256.9,32.0" fill="#FFFFFF" stroke="#1F2D36" stroke-width="1.3"/><polygon points="292.9,40.0 286.0,44.0 279.1,40.0 279.1,32.0 286.0,28.0 292.9,32.0" fill="#FFFFFF" stroke="#1F2D36" stroke-width="1.3"/><text x="318.0" y="40.0" font-size="13" font-weight="700" text-anchor="start" fill="#1F2D36">TGFβ</text><rect x="238" y="54" width="24" height="26" rx="6" fill="#0E6E80"/><line x1="250.0" y1="84.0" x2="250.0" y2="136.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="196.0" y="140.0" width="108" height="36" rx="8" fill="#FFFFFF" stroke="#0E6E80" stroke-width="1.5"/><text x="250.0" y="162.3" font-size="12" font-weight="600" text-anchor="middle" fill="#1F2D36">TGFβ signal</text><rect x="380.0" y="140.0" width="90" height="36" rx="8" fill="#F4DCE8" stroke="#A8336E" stroke-width="1.5"/><text x="425.0" y="163.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1F2D36">SKI</text><line x1="376.0" y1="158.0" x2="310.0" y2="158.0" stroke="#A8336E" stroke-width="1.8" stroke-linecap="round"/><line x1="310.0" y1="166.0" x2="310.0" y2="150.0" stroke="#A8336E" stroke-width="2.4" stroke-linecap="round"/><rect x="380.0" y="236.0" width="90" height="36" rx="8" fill="#E4DCF1" stroke="#5A3F8F" stroke-width="1.5"/><text x="425.0" y="258.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1F2D36">ARKADIA</text><line x1="425.0" y1="232.0" x2="425.0" y2="182.0" stroke="#5A3F8F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahm)"/><text x="436.0" y="212.0" font-size="11" font-weight="600" text-anchor="start" fill="#5A3F8F">degrades</text><line x1="250.0" y1="180.0" x2="250.0" y2="232.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="178.0" y="236.0" width="144" height="40" rx="8" fill="#FFFFFF" stroke="#0E6E80" stroke-width="1.5"/><text x="250.0" y="253.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1F2D36">FOXP3 program</text><text x="250.0" y="267.3" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1F2D36">stable, suppressive</text><