<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">Optical injection of gold nanoparticles into living cells</title><desc id="d">Step one, a continuous-wave laser traps and places a single gold nanoparticle on a living cell. Step two, plasmonic heating and optical force inject it into the cell.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><text x="165.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2D36">1  place on membrane</text><path d="M30,350 C30,230 90,180 165,180 C240,180 300,230 300,350 Z" fill="#D3E9ED" fill-opacity=".6" stroke="#0E6E80" stroke-width="1.8"/><ellipse cx="165" cy="300" rx="52" ry="30" fill="#FFFFFF" fill-opacity=".6" stroke="#0E6E80" stroke-opacity=".5"/><polygon points="119,56 211,56 171,176 159,176" fill="url(#beam)"/><circle cx="165" cy="170" r="10" fill="url(#gold)" stroke="#B08A1E"/><circle cx="105" cy="120" r="7" fill="url(#gold)" stroke="#B08A1E" opacity=".7"/><circle cx="235" cy="100" r="7" fill="url(#gold)" stroke="#B08A1E" opacity=".7"/><circle cx="75" cy="90" r="7" fill="url(#gold)" stroke="#B08A1E" opacity=".7"/><text x="475.0" y="40.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1F2D36">2  inject with light</text><path d="M340,350 C340,230 400,180 475,180 C550,180 610,230 610,350 Z" fill="#D3E9ED" fill-opacity=".6" stroke="#0E6E80" stroke-width="1.8"/><ellipse cx="475" cy="300" rx="52" ry="30" fill="#FFFFFF" fill-opacity=".6" stroke="#0E6E80" stroke-opacity=".5"/><polygon points="429,56 521,56 481,226 469,226" fill="url(#beam)"/><circle cx="475" cy="226" r="26" fill="url(#glow)"/><circle cx="475" cy="226" r="10" fill="url(#gold)" stroke="#B08A1E"/><text x="497.0" y="256.0" font-size="11" font-weight="700" text-anchor="start" fill="#8C6B55">heat + force</text><text x="490.0" y="380.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#6B7A83">&gt;70% of cells survive</text></g></svg>