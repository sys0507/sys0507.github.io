<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">Serotonin transporter as an immune checkpoint on CD8 T cells</title><desc id="d">Tumor-infiltrating CD8 T cells upregulate SERT, which clears serotonin and dampens their activity. SSRIs block SERT and combine with PD-1 blockade to slow tumor growth.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><path d="M40,110 C40,70 80,50 150,50 C220,50 260,70 260,110 L260,330 L40,330 Z" fill="#D3E9ED" fill-opacity=".55" stroke="#0E6E80" stroke-width="2"/><text x="150.0" y="356.0" font-size="11.5" font-weight="500" text-anchor="middle" fill="#6B7A83">tumor-infiltrating CD8 T cell</text><rect x="248" y="170" width="24" height="56" rx="8" fill="#A8336E"/><text x="244.0" y="162.0" font-size="12.5" font-weight="700" text-anchor="end" fill="#A8336E">SERT</text><polygon points="323.8,126.5 316.0,131.0 308.2,126.5 308.2,117.5 316.0,113.0 323.8,117.5" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.3"/><polygon points="357.8,154.5 350.0,159.0 342.2,154.5 342.2,145.5 350.0,141.0 357.8,145.5" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.3"/><polygon points="337.8,194.5 330.0,199.0 322.2,194.5 322.2,185.5 330.0,181.0 337.8,185.5" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.3"/><polygon points="369.8,230.5 362.0,235.0 354.2,230.5 354.2,221.5 362.0,217.0 369.8,221.5" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.3"/><polygon points="313.8,154.5 306.0,159.0 298.2,154.5 298.2,145.5 306.0,141.0 313.8,145.5" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.3"/><text x="334.0" y="104.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#5A3F8F">5-HT</text><line x1="300.0" y1="198.0" x2="280.0" y2="198.0" stroke="#5A3F8F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahm)"/><line x1="240.0" y1="198.0" x2="190.0" y2="198.0" stroke="#5A3F8F" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ahm)"/><text x="150.0" y="186.0" font-size="11" font-weight="600" text-anchor="middle" fill="#5A3F8F">serotonin</text><text x="150.0" y="202.0" font-size="11" font-weight="600" text-anchor="middle" fill="#5A3F8F">cleared</text><text x="150.0" y="250.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2D36">T cell activity ↓</text><g transform="rotate(-20 322 290)"><rect x="302" y="282" width="40" height="16" rx="8" fill="#FFFFFF" stroke="#1F2D36" stroke-width="1.5"/><path d="M322,282 h12 a8,8 0 0 1 0,16 h-12 z" fill="#F4DCE8" stroke="#1F2D36" stroke-width="1.5"/></g><line x1="306.0" y1="272.0" x2="280.0" y2="234.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round"/><line x1="273.4" y1="238.5" x2="286.6" y2="229.5" stroke="#1F2D36" stroke-width="2.4" stroke-linecap="round"/><text x="322.0" y="324.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1F2D36">SSRI</text><path d="M420,70 L420,300 L600,300" fill="none" stroke="#1F2D36" stroke-width="1.4"/><text x="510.0" y="322.0" font-s