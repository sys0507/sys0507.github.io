<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">NGS Intelligent Workflow Assistant architecture</title><desc id="d">A scientist chats with an agent built on the Claude Agent SDK. The agent calls pipeline tools over MCP, waits for human approval, submits SLURM jobs on the HPC cluster, and returns results into a per-user sandbox with an audit log.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><text x="30.0" y="40.0" font-size="12.5" font-weight="600" text-anchor="start" fill="#6B7A83">chat in, reproducible SLURM runs out</text><rect x="30.0" y="150.0" width="110" height="64" rx="8" fill="#FFFFFF" stroke="#1F2D36" stroke-width="1.5"/><text x="85.0" y="178.8" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2D36">Bench</text><text x="85.0" y="193.8" font-size="12" font-weight="700" text-anchor="middle" fill="#1F2D36">scientist</text><rect x="170.0" y="150.0" width="120" height="64" rx=