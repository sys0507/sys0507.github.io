<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">Full-Chain Development Skills: eleven stages from idea to release</title><desc id="d">A ring of eleven stages, from project ledger and research through PRD, specification, design, TDD implementation and testing to retrospective and release, with gates where decisions are expensive to reverse.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><circle cx="320" cy="205" r="140" fill="none" stroke="#C9D3D8" stroke-width="2"/><circle cx="320.0" cy="65.0" r="9" fill="#FFFFFF" stroke="#0E6E80" stroke-width="2.4"/><text x="320.0" y="45.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1F2D36">research</text><circle cx="395.7" cy="87.2" r="9" fill="#FFFFFF" stroke="#0E6E80" stroke-width="2.4"/><line x1="419.0" y1="119.2" x2="432.6" y2="107.4" stroke="#1F2D36" stroke-width="3" stroke-linecap="round"/><text x="408.7" y="71.0" font-size="11.5" font