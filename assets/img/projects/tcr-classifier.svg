<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">TCR Pathology Classifier model and validation funnel</title><desc id="d">Paired TRA and TRB CDR3 sequences are embedded with a fine-tuned ESM2 protein language model, fused with V gene embeddings, and classified by pathology. In a MART-1 study, about 7,000 clones were narrowed to 31 tested, with 11 validated.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#1F2D36"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.2,5 L0,9.2 z" fill="#6B7A83"/></marker><radialGradient id="gold" cx="35%" cy="35%" r="70%"><stop offset="0" stop-color="#F6E7B0"/><stop offset=".55" stop-color="#D2AE3C"/><stop offset="1" stop-color="#B08A1E"/></radialGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB3C0" stop-opacity=".05"/><stop offset="1" stop-color="#6FB3C0" stop-opacity=".55"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F2C14E" stop-opacity=".75"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/></radialGradient></defs><rect width="640" height="400" fill="#FAFBFA"/><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2D36"><text x="30" y="72" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" fill="#0E6E80">CAVRDSNYQLIW</text><text x="30" y="132" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" fill="#0E6E80">CASSLGQAYEQYF</text><text x="30.0" y="52.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#6B7A83">TRA CDR3</text><text x="30.0" y="112.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#6B7A83">TRB CDR3</text><rect x="170.0" y="52.0" width="104" height="32" rx="8" fill="#E4DCF1" stroke="#5A3F8F" stroke-width="1.5"/><text x="222.0" y="72.1" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1F2D36">ESM2 650M</text><rect x="170.0" y="112.0" width="104" height="32" rx="8" fill="#E4DCF1" stroke="#5A3F8F" stroke-width="1.5"/><text x="222.0" y="132.1" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1F2D36">ESM2 650M</text><line x1="144.0" y1="68.0" x2="166.0" y2="68.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><line x1="150.0" y1="128.0" x2="166.0" y2="128.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300.0" y="76.0" width="110" height="44" rx="8" fill="#FFFFFF" stroke="#5A3F8F" stroke-width="1.5"/><text x="355.0" y="95.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1F2D36">cross-</text><text x="355.0" y="109.3" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1F2D36">attention</text><line x1="276.0" y1="68.0" x2="298.0" y2="88.0" stroke="#1F2D36" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="276.0" y1="128.0" x2="298.0" y2="108.0" stroke="#1F2D36" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300.0" y="148.0" width="110" height="30" rx="8" fill="#FFFFFF" stroke="#C9D3D8" stroke-width="1.5"/><text x="355.0" y="166.8" font-size="10.5" font-weight="600" text-anchor="middle" fill="#1F2D36">+ V gene emb.</text><line x1="412.0" y1="98.0" x2="440.0" y2="98.0" stroke="#1F2D36" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/><rect x="446" y="58" width="98" height="12" rx="3" fill="#A8336E" fill-opacity="1"/><text x="572.0" y="68.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#1F2D36">melanoma</text><rect x="446" y="78" width="36" height="12" rx="3" fill="#D58CB2" fill-opacity="0.6"/><text x="572.0" y="88.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#6B7A83">class 2</text><rect x="446" y="98" width="19" height="12" rx="3" fill="#D58CB2" fill-opacity="0.6"/><text x="572.0" y="108.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#6B7A83">class 3</text><rect x="446" y="118" width="10" height="12" rx="3" fill="#D58CB2" fill-opacity="0.6"/><text x="572.0" y="128.0" font-size="10.5" font-weight="600" text-anchor="start" fill="#6B7A83">class 4</text><line x1="30" y1="212" x2="610" y2="212" stroke="#C9D3D8" stroke-width="1.2"/><text x="30.0" y="238.0" font-size="12" font-weight="700" text-anchor="start" fill="#1F2D36">MART-1 proof of concept</text><rect x="30" y="261.0" width="128" height="110.0" rx="6" fill="#D3E9ED" stroke="#0E6E80" stroke-width="1.4"/><text x="94.0" y="322.0" font-size="16" font-weight="800" text-anchor="middle" fill="#1F2D36">6,737</text><text x="94.0" y="386.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6B7A83">raw clones</text><line x1="162.0" y1="316.0" x2="178.0" y2="316.0" stroke="#6B7A83" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahm)"/><rect x="182" y="285.8" width="128" height="60.5" rx="6" fill="#E4DCF1" stroke="#5A3F8F" stroke-width="1.4"/><text x="246.0" y="322.0" font-size="17" font-weight="800" text-anchor="middle" fill="#1F2D36">572</text><text x="246.0" y="386.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6B7A83">prioritized</text><line x1="314.0" y1="316.0" x2="330.0" y2="316.0" stroke="#6B7A83" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahm)"/><rect x="334" y="299.5" width="128" height="33.0" rx="6" fill="#F4DCE8" stroke="#A8336E" stroke-width="1.4"/><text x="398.0" y="322.0" font-size="17" font-weight="800" text-anchor="middle" fill="#1F2D36">31</text><text x="398.0" y="386.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6B7A83">tested</text><line x1="466.0" y1="316.0" x2="482.0" y2="316.0" stroke="#6B7A83" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ahm)"/><rect x="486" y="305.0" width="128" height="22.0" rx="6" fill="#A8336E" stroke="#A8336E" stroke-width="1.4"/><text x="550.0" y="322.0" font-size="17" font-weight="800" text-anchor="middle" fill="#FFFFFF">11</text><text x="550.0" y="386.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6B7A83">validated</text></g></svg>